<dsb-container-atom title="Icon" >
    <section class="d-flex gap-5" >
        @for(icon of icons; track icon){
            <dsb-icon-atom [icon]="icon.name" [size]="icon.size"></dsb-icon-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Badge" >
    <section class="d-flex gap-2" >
        @for(badge of badges; track badge){
            <dsb-badge-atom [text]="badge.type | titlecase" [type]="badge.type" [typeText]="badge.typeText" ></dsb-badge-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Button" >
    <section class="d-flex gap-2" >
        @for(button of buttons; track button){
            <dsb-button-atom 
                [idButton]="button.idButton" 
                [text]="button.type | titlecase" 
                [type]="button.type" 
                (clicker)="onClick($event)" >
            </dsb-button-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Image" >
    <section class="d-flex gap-3 align-items-center" >
        @for(image of images; track image.src){
            <dsb-image-atom 
                [src]="image.src" 
                [alt]="image.alt" 
                [type]="image.type" 
                [rounded]="image.rounded" 
                [width]="image.width" >
            </dsb-image-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Select" >
    <section class="d-flex gap-3 align-items-center" >
        <dsb-select-atom 
            [options]="selectOptions" 
            [ariaLabel]="'Cantidad'" 
            (selected)="onSelect($event)" >
        </dsb-select-atom>
        <dsb-select-atom 
            [options]="selectOptions" 
            size="sm" 
            [ariaLabel]="'Talla'" 
            (selected)="onSelect($event)" >
        </dsb-select-atom>
        <dsb-select-atom 
            [options]="selectOptions" 
            size="lg" 
            [ariaLabel]="'Color'" 
            (selected)="onSelect($event)" >
        </dsb-select-atom>
        <dsb-select-atom 
            [options]="selectOptions" 
            [disabled]="true" 
            [ariaLabel]="'Select deshabilitado'" >
        </dsb-select-atom>
    </section>
</dsb-container-atom>
