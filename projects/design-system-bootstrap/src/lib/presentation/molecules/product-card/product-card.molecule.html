<div class="card h-100">
  <dsb-image-atom
    [src]="product.image"
    [alt]="product.name"
    type="fluid"
  />

  <div class="card-body d-flex flex-column">
    <div
      class="d-flex justify-content-between align-items-start gap-2 mb-2"
    >
      <h5 class="card-title mb-0">
        {{ product.name }}
      </h5>

      <dsb-badge-atom
        [text]="product.available ? 'Disponible' : 'Agotado'"
        [type]="product.available ? 'success' : 'danger'"
        typeText="text-white"
      />
    </div>

    <p class="card-text fs-5 fw-bold">
      ${{ product.price | number }}
    </p>

    @if (product.available) {
  <div class="mt-auto">
    <dsb-button-atom
      text="Agregar al carrito"
      [idButton]="product.id"
      type="primary"
      (clicker)="onAddToCart()"
    />
  </div>
}
  </div>
</div>
